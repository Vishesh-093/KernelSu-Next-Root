name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Runtime integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact target and runtime artifacts
        run: python3 scripts/verify_integrity.py

  android-build:
    name: Android tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-37' \
            'ndk;29.0.14206865'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          ./gradlew --no-configuration-cache \
            :app:testStandardDebugUnitTest \
            :app:testSpoofedDebugUnitTest

      - name: Lint debug variants
        run: |
          ./gradlew --no-configuration-cache \
            :app:lintStandardDebug \
            :app:lintSpoofedDebug

      - name: Assemble debug variants
        run: |
          ./gradlew --no-configuration-cache \
            :app:assembleStandardDebug \
            :app:assembleSpoofedDebug
